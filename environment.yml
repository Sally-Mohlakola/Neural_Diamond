# Builds the Python environment for gathering, training, rendering, and analysis.
# The versions are the ones the tests pass on, so that a new install matches them.
# Usage:
#   conda env create -f environment.yml
#   conda activate jojo
name: jojo
channels:
  - conda-forge
dependencies:
  - python=3.12.13
  - ffmpeg
  - pip
  - pip:
      - mitsuba==3.8.0
      - drjit==1.3.1
      - torch==2.12.1
      - torchvision==0.27.1
      - numpy==2.4.6
      - matplotlib==3.11.0
      - pillow==12.2.0
      - opencv-python-headless==4.13.0.92
      - imageio==2.37.3
      - psutil==7.2.2
      - flip-evaluator==1.7
      - lpips==0.1.4
